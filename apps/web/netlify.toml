# Talocode Cloud dashboard for https://stacklane.talocode.site
#
# The app's own metadataBase in app/layout.tsx declares stacklane.talocode.site,
# so that is its canonical domain. Deploy it as a separate Netlify site with base
# directory apps/web AND configuration_file_path apps/web/netlify.toml. Both are
# required: without the explicit config path Netlify reads the repo root config
# instead and resolves publish against this base, producing a bad path.

[build]
  command = "npm install && npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  # Point browser API calls at production control plane
  NEXT_PUBLIC_API_BASE_URL = "https://api.talocode.site"

[context.production.environment]
  NEXT_PUBLIC_API_BASE_URL = "https://api.talocode.site"

[context.deploy-preview.environment]
  NEXT_PUBLIC_API_BASE_URL = "https://api.talocode.site"
